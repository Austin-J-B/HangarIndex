    <path fill="#b7cbcd" d="m1119 633 103-86 45 25-76 95Z"/>
    <path fill="#f7f6ef" d="M1243 532c-35-4-65 17-89 45l-20 49c-11 31 6 53 37 57 26 3 61-9 85-29 28-23 48-65 35-96q-15-26-48-26Z"/>
    <path fill="#c9dad8" stroke="none" d="M1135 634q-8 35 37 43 36 2 80-28l-25-22q-63 50-92 7Z"/>
    <path stroke="#81999f" stroke-width="3" d="M1216 539q-40 29-42 83m-29 24 64-32"/>
