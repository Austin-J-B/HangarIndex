    <ellipse cx="1262" cy="591" rx="26" ry="42" transform="rotate(13 1262 591)" fill="#365362" stroke="none"/>
    <g transform="translate(1262 591) rotate(13)" stroke="#91a9ae" stroke-width="2.5">
      <path d="M0-8q-9-9-4-27M5-5q10-5 15-18M7 3q10 7 12 20M2 8q6 12 2 27M-5 6q-10 5-14 17M-7-3q-10-8-12-20"/>
